server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # /img/... se cere de la containerul "images"
    location /img/ {
        proxy_pass http://images:80/;
    }

    # /css/... se cere de la containerul "css"
    location /css/ {
        proxy_pass http://css:80/;
    }
}
