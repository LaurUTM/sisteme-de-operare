services:
  web:                      # containerul 1: site-ul CV (nginx)
    build: ./web
    ports:
      - "8090:80"           # browser: http://localhost:8090
    depends_on: [images, css]
    networks: [lab7net]

  images:                   # containerul 2: imaginile
    build: ./images
    networks: [lab7net]

  css:                      # containerul 3: foaia de stil CSS
    build: ./css
    networks: [lab7net]

networks:
  lab7net:                  # retea comuna: containerele se gasesc dupa nume
